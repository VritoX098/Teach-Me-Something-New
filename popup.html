<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teach Me Something New</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app" role="main">
      <header class="header">
        <h1 class="title">Teach Me Something New</h1>
        <p class="subtitle">One click. One idea. No decisions.</p>
      </header>

      <section class="content" id="content">
        <div class="state state-idle" id="state-idle">
          <button
            id="teach-btn"
            class="btn btn-primary btn-large"
            type="button"
            aria-label="Teach me something new"
          >
            Teach Me Something New
          </button>
          <p class="hint">We'll pick a random topic for you.</p>
        </div>

        <div class="state state-loading hidden" id="state-loading" aria-live="polite">
          <div class="spinner" aria-hidden="true"></div>
          <p class="loading-text">Finding something interesting...</p>
        </div>

        <div class="state state-result hidden" id="state-result" aria-live="polite">
          <article class="card" id="result-card">
            <span class="category" id="result-category">Category</span>
            <h2 class="card-title" id="result-title">Title</h2>
            <p class="card-description" id="result-description">Description</p>
            <div class="card-actions">
              <button id="open-btn" class="btn btn-primary" type="button">Open</button>
              <button id="again-btn" class="btn btn-secondary" type="button">Another Random</button>
            </div>
          </article>
        </div>

        <div class="state state-error hidden" id="state-error" role="alert">
          <p class="error-text" id="error-text">Something went wrong.</p>
          <button id="retry-btn" class="btn btn-primary" type="button">Try Again</button>
        </div>
      </section>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
